name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VanTools.sln

      - name: Build
        run: dotnet build VanTools.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VanTools.sln --configuration Release --no-build

  report-failure:
    name: Report failure
    needs: test
    if: >
      failure() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Create issue for ${{ matrix.os }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI failure: tests on ${{ matrix.os }}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const exists = issues.some((i) => i.title === title);
            if (exists) {
              core.info(`An open issue already exists: ${title}`);
              return;
            }

            const body = [
              `The test suite failed on **${{ matrix.os }}**.`,
              '',
              `- Operating system: \`${{ matrix.os }}\``,
              `- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              `- Commit: \`${{ github.sha }}\``,
              '',
              'This issue was created automatically. It will not be duplicated while it remains open.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VanTools.sln

      - name: Verify formatting
        run: dotnet format VanTools.sln --verify-no-changes --no-restore --verbosity diagnostic
